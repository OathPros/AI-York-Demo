name: Deploy Worker

on:
  push:
    branches: [main]
    paths: [.github/workflows/worker.yml]
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply reviewed remote D1 migrations before deploying
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: demo-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - if: inputs.apply_migrations
        run: npx wrangler d1 migrations apply DB --remote
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  release-pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: demo-worker
    env:
      VITE_API_BASE_URL: https://ai-york-demo-api.luke-gagliardi.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify Worker and page content endpoint
        run: |
          curl -fsS --retry 4 "$VITE_API_BASE_URL/health" | jq -e '.ok and .database'
          curl -fsS --retry 4 "$VITE_API_BASE_URL/api/v1/public/release-probe/pages" | jq -e '.pages | type == "object"'
      - run: npm ci
      - run: npm run build
      - name: Publish and verify Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          page_url=https://ai-york-demo.pages.dev/
          asset=$(node -p 'require("fs").readdirSync("apps/web/dist/assets").find(x => x.endsWith(".js"))')
          matches_release() {
            curl -fsS "$page_url?release=$GITHUB_SHA" -o "$RUNNER_TEMP/ai-york-live.html" &&
              grep -Fq "/assets/$asset" "$RUNNER_TEMP/ai-york-live.html" &&
              curl -fsS "${page_url}assets/$asset" -o /dev/null
          }
          if matches_release; then exit 0; fi
          npx wrangler pages deploy apps/web/dist --project-name ai-york-demo --branch main
          for attempt in {1..6}; do
            if matches_release; then exit 0; fi
            sleep 10
          done
          exit 1
