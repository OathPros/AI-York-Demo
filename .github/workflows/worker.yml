name: Deploy Worker

on:
  push:
    branches: [main]
    paths: [.github/workflows/worker.yml]
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply reviewed remote D1 migrations before deploying
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: demo-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - if: inputs.apply_migrations
        run: npx wrangler d1 migrations apply DB --remote
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  release-learning:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: demo-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://ai-york-demo-api.luke-gagliardi.workers.dev
      - name: Publish and verify Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          site=https://ai-york-demo.pages.dev
          asset=$(node -p 'require("fs").readdirSync("apps/web/dist/assets").find(x => x.endsWith(".js"))')
          matches_release() {
            curl -fsS "$site/?release=$GITHUB_SHA" -o "$RUNNER_TEMP/learning-cf.html" &&
              grep -Fq "/assets/$asset" "$RUNNER_TEMP/learning-cf.html" &&
              curl -fsS "$site/assets/$asset" -o /dev/null
          }
          if matches_release; then exit 0; fi
          npx wrangler pages deploy apps/web/dist --project-name ai-york-demo --branch main
          for attempt in {1..8}; do
            if matches_release; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Verify learning guides on GitHub Pages
        run: |
          site=https://oathpros.github.io
          for attempt in {1..12}; do
            if curl -fsS "$site/AI-York-Demo/?release=$GITHUB_SHA" -o "$RUNNER_TEMP/learning-gh.html"; then
              asset=$(sed -n 's/.*src="\([^"]*\/assets\/index-[^"]*\.js\)".*/\1/p' "$RUNNER_TEMP/learning-gh.html")
              if [ -n "$asset" ] && curl -fsS "$site$asset" -o "$RUNNER_TEMP/learning-gh.js" &&
                grep -Fq 'Generative AI fundamentals' "$RUNNER_TEMP/learning-gh.js" &&
                grep -Fq 'Use AI within course rules' "$RUNNER_TEMP/learning-gh.js" &&
                grep -Fq 'Design a course approach' "$RUNNER_TEMP/learning-gh.js"; then
                exit 0
              fi
            fi
            sleep 10
          done
          exit 1
